# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch06_thrust_day
status: candidate
source:
  book: schwager
  chapter: 6
  pages: [114, 114]

# День верхнего разгона = закрытие выше максимума предыдущего дня;
# нижнего разгона = закрытие ниже минимума предыдущего дня (стр.114).
# Единичный разгонный день незначим (обычное событие); значима СЕРИЯ:
# несколько дней верхнего разгона (необязательно подряд) = явная сила
# рынка, серия нижних = слабость. На боковике число верхних ≈ нижних
# (стр.114) → баланс разгонных дней может служить признаком режима.
# Сколько дней в серии и в каком окне — книга НЕ задаёт.

params:
  thrust_series_n:
    value: REQUIRES_DECISION
    options: [3, 4, 5]          # предложение агента, в книге числа нет
    why: "книга: «несколько дней верхнего разгона отражает явную силу рынка» (стр.114), число не задано; 3/4/5 — предложение агента, в книге числа нет"
  thrust_window:
    value: REQUIRES_DECISION
    options: [10, 20]           # предложение агента, в книге числа нет
    why: "окно подсчёта разгонных дней (необязательно подряд) книга не задаёт; 10/20 — предложение агента, в книге числа нет"

action: BUY
weight: REQUIRES_DECISION
description: "Серия дней верхнего разгона (close > макс. пред. дня) в окне = сила рынка / подтверждение аптренда"
conditions:
  # thrust_up_count = число дней с close > prev_high в окне thrust_window
  - { indicator: thrust_up_count, operator: ">=", value: thrust_series_n }

exit: []

missing_indicators:
  - thrust_up_count    # число дней с close > prev_high в окне thrust_window; нужна реализация
  - thrust_down_count  # зеркальное; нужна реализация
