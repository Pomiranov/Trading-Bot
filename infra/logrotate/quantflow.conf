# Logrotate configuration for QuantFlow
# Install: sudo cp infra/logrotate/quantflow.conf /etc/logrotate.d/quantflow
#
# ЗАМЕРЕНО 2026-08-01: на Windows-машине этот конфиг НЕ ПРИМЕНЯЕТСЯ вовсе —
# путь ниже указывает на Mac, а logrotate на Windows не установлен.
# forward_d1.log там не ротируется и не усекается: run_forward_d1.bat пишет
# только через `>>`, ни одного `>`.
#
# 🚫 logs/forward_runs.jsonl НЕ РОТИРОВАТЬ И НЕ УСЕКАТЬ НИКОГДА.
# Две строки в сутки — около 70 КБ в год, ротация не нужна ни на одной машине.
# Причина запрета не в объёме: у журнала прогонов есть строка journal_created,
# по которой сторож отличает «записи о старте нет» (прогона не было) от
# «свидетельство утрачено». `copytruncate` ниже обнулил бы файл НА МЕСТЕ, и эти
# два случая снова стали бы неразличимы — ровно та слепота, из-за которой
# 01.08 пропуск ночного прогона проехал молча (долг №46).
# Маска `*.log` журнал не задевает (расширение .jsonl), и это записано ЯВНО,
# чтобы будущая маска вида `logs/*` не съела его молча.
/Users/danila/Downloads/Trading-Bot-main/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 50M
}