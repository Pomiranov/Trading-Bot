# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch06_island_reversal
status: candidate
source:
  book: schwager
  chapter: 6
  pages: [140, 148]

# Островной разворот вверх→вниз (островная вершина): после продолжительного
# роста возникает верхний разрыв, затем один или несколько дней выше разрыва,
# и наконец разрыв вниз (стр.140) → вершина, SELL. Зеркально — островная
# впадина (BUY). Единственная формализуемая формация в разделе «разворотные
# формации»: остальные (V, двойные/тройные вершины, Г&П, круглые, клин,
# треугольники) субъективны — см. карточку §2/§6.
# [мнение автора, стр.148] ожидание подтверждения второго разрыва снижает
# число ложных выводов, но ухудшает уровень входа при достоверном сигнале.

params:
  island_min_days:
    value: REQUIRES_DECISION
    options: [1, 3]            # 1 — из книги («один»), 3 — предложение агента
    quote: "один или несколько дней находятся выше разрыва"
    page: 140
    note: "минимум баров «острова» между двумя разрывами; книга: «один или несколько», верхняя граница не задана"

action: SELL
weight: REQUIRES_DECISION
description: "Островная вершина: разрыв вверх после роста + N баров выше разрыва + разрыв вниз"
conditions:
  # island_top_flag = 1 когда: gap_up после роста, island_min_days баров с
  #   минимумами выше уровня разрыва, затем gap_down
  - { indicator: island_top_flag, operator: "==", value: 1 }

exit: []

missing_indicators:
  - island_top_flag     # разрыв вверх + N баров выше + разрыв вниз; нужна реализация
  - island_bottom_flag  # зеркальное; нужна реализация
  - gap_up_flag         # low(t) > high(t-1); нужна реализация
  - gap_down_flag       # high(t) < low(t-1); нужна реализация
