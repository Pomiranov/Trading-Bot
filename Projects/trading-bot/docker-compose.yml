version: '3.8'

services:

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: trading_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-trading_bot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: trading_adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db_data: