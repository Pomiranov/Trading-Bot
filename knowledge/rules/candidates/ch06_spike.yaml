# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch06_spike
status: candidate
source:
  book: schwager
  chapter: 6
  pages: [104, 108]

# Шип — РАЗВОРОТНЫЙ маркер. Шип вверх после повышения цен = потенциальный
# относительный максимум (кульминация покупок) → выход/шорт; зеркально
# шип вниз после снижения = потенциальный относительный минимум → BUY.
# ВНИМАНИЕ (lookahead): математическое определение использует максимум
# СЛЕДУЮЩЕГО дня Ht+1 (стр.107) — шип подтверждается только спустя 1 бар.
# В реалтайме сигнал виден с задержкой в 1 бар; учесть в бэктесте, чтобы
# не получить заглядывание в будущее.

params:
  spike_k:
    value: REQUIRES_DECISION
    options: [0.5, 0.75, 1.0]   # 0.75 — пример из книги, остальные — предложение агента
    quote: "к — устанавливаемый коэффициент (например, к = 0,75)"
    page: 107
    note: "насколько шип возвышается над соседними вершинами в долях ADTR; 0,75 дано как пример, не жёсткий порог"
  adtr_period:
    value: 10
    quote: "средний дневной истинный диапазон в течение последних 10 дней"
    page: 107
    note: "период задан в определении ADTR, не как «например» → взят из книги"
  close_quarter_mult:
    value: 3
    quote: "Ht-Ct>3 * (Сt - Lt)"
    page: 107
    note: "закрытие в нижней четверти дневного диапазона для шипа вверх (стр.108); множитель дан жёстко, не «например»"
  spike_n_lookback:
    value: REQUIRES_DECISION
    options: [20, 50]           # 50 — пример из книги, 20 — предложение агента
    quote: "N — заданная константа (например, N = 50)"
    page: 108
    note: "Ht должен превышать наивысший максимум за N дней (гарантия предшествующего роста); 50 — пример"

action: SELL
weight: REQUIRES_DECISION
description: "Шип вверх (мат. определение Швагера) = потенциальный относительный максимум → выход/шорт; зеркально шип вниз = BUY"
conditions:
  # spike_up_flag = 1 когда одновременно:
  #   Ht - max(Ht-1, Ht+1) > spike_k * ADTR(adtr_period)
  #   Ht - Ct > close_quarter_mult * (Ct - Lt)           (закрытие в нижней четверти)
  #   Ht > наивысший максимум за spike_n_lookback предшествующих дней
  - { indicator: spike_up_flag, operator: "==", value: 1 }

exit: []

missing_indicators:
  - spike_up_flag     # нужна реализация: три условия выше (стр.107-108)
  - spike_down_flag   # зеркальное определение шипа вниз; нужна реализация
  - adtr_10           # средний истинный диапазон за 10 дней (ATR-подобный); нужна реализация
