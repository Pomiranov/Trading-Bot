# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch10_demark_sequential
status: candidate
source:
  book: schwager
  chapter: 10
  pages: [188, 195]

params:
  setup_length:
    value: 9
    quote: "наличие последовательности из девяти или более дней, цена закрытия
      каждого из которых ниже, чем цена закрытия ... на четыре дня раньше"
    page: 188
    note: "минимум подряд идущих дней начальной стадии (buy setup)"
  setup_lookback:
    value: 4
    quote: "ниже, чем цена закрытия торговой сессии на четыре дня раньше"
    page: 188
  intersection_start_day:
    value: 8
    quote: "максимум любого дня, начиная с восьмого дня начальной стадии и далее"
    page: 188
  intersection_lookback:
    value: 3
    quote: "превышал ценовой минимум, отмеченный на рынке три дня назад или ранее"
    page: 188
  countdown_lookback:
    value: 2
    quote: "увеличивается на единицу в каждый из дней, закрытие которого ниже
      минимума двумя днями раньше"
    page: 188
  countdown_target:
    value: 13
    quote: "При значении счетчика, равном 13, подается сигнал покупки"
    page: 188

# Полный алгоритм buy-сигнала (стр.188-189), SELL зеркально (стр.189):
# 1. Setup: >=9 подряд закрытий < закрытия 4 бара назад.
# 2. Intersection: с 8-го дня setup хай дня > лоу 3+ бара назад.
# 3. Countdown: с 0, +1 каждый день, где close < low 2 бара назад (не подряд);
#    сигнал при 13. Обнуление: close > макс. внутридневного хая setup;
#    возникла sell-setup; началась новая buy-setup.
action: BUY                # ДеМарк как разворотный сигнал (=критерий закрытия шорта / вход в лонг)
weight: REQUIRES_DECISION
description: "Последовательность ДеМарка (buy): начальная стадия 9 закрытий
  ниже закрытия 4 бара назад + точка пересечения + счётчик до 13. Индикатор
  истощения нисходящего тренда. SELL зеркально."
conditions:
  - { indicator: demark_setup_count, operator: ">=", value: setup_length, note: "начальная стадия покупки завершена, стр.188" }
  - { indicator: demark_intersection, operator: "==", value: 1, note: "точка пересечения выполнена, стр.188" }
  - { indicator: demark_countdown, operator: ">=", value: countdown_target, note: "счётчик достиг 13 → сигнал покупки, стр.188" }

exit:
  # книга подаёт ДеМарк как критерий закрытия/разворота, не даёт стоп/цель в R;
  # инвалидация = условия обнуления счётчика (стр.188)

missing_indicators:
  - demark_setup_count     # счётчик подряд идущих закрытий < закрытия 4 бара назад — нужна реализация
  - demark_intersection    # флаг выполнения точки пересечения (хай >= лоу 3+ бара назад с 8-го дня) — нужна реализация
  - demark_countdown       # счётчик обратного отсчёта с обнулением по 3 условиям — нужна реализация

# Оговорки автора: приведено КРАТКОЕ изложение; полный ДеМарк содержит
# 'несколько дополнительных квалифицирующих условий и ... альтернативных
# правил' (стр.188), опущенных здесь → см. вопрос 3. Примеры (рис.10.12-10.16)
# отобраны задним числом; 'в реальной торговле точность... не достигает'
# почти безупречных параметров примеров (стр.196). [мнение автора]
# 'может быть очень эффективным инструментом' и согласуется с трендследящими
# методами (стр.196).
