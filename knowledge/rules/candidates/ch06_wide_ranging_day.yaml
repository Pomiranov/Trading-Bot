# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch06_wide_ranging_day
status: candidate
source:
  book: schwager
  chapter: 6
  pages: [116, 118]

# Широкодиапазонный день = день, чья волатильность резко выше средней.
# Сигнальная ценность (стр.117-118): ШД-день с ВЫСОКИМ закрытием после
# продолжительного СНИЖЕНИЯ = разворот вверх (BUY); ШД-день с НИЗКИМ
# закрытием после продолжительного РОСТА = разворот вниз (SELL).
# ВАЖНО: без контекста предшествующего тренда сам по себе ШД-день не
# сигнал разворота. Условие «после длительного снижения/роста» книга
# численно не задаёт — см. вопрос к Нику (нужен фильтр предыдущего тренда).
# Понятие используется в гл.18 как основной элемент торговой системы (стр.118).

params:
  vr_k:
    value: REQUIRES_DECISION
    options: [1.5, 2.0, 2.5]    # 2.0 — пример из книги, остальные — предложение агента
    quote: "коэффициент волатильности (volatility ratio — VR) больше к (например, k = 2,0)"
    page: 117
    note: "порог отношения истинного диапазона дня к среднему; 2,0 — пример"
  vr_lookback:
    value: REQUIRES_DECISION
    options: [15, 20]           # 15 — пример из книги, 20 — предложение агента
    quote: "истинный диапазон предшествующего N-дневного периода (например, N = 15)"
    page: 117
    note: "окно среднего истинного диапазона в знаменателе VR; 15 — пример"
  close_position_thr:
    value: REQUIRES_DECISION
    options: [0.7, 0.8]         # предложение агента, в книге числа нет
    why: "книга: «высокое закрытие» / «низкое закрытие» словами (стр.117-118), порог позиции закрытия в диапазоне численно не задан; 0.7/0.8 — предложение агента, в книге числа нет"

action: BUY
weight: REQUIRES_DECISION
description: "ШД-день с высоким закрытием после длит. снижения = разворот вверх (BUY); зеркально низкое закрытие после роста = SELL"
conditions:
  # wide_ranging_day_flag = 1 когда VR = TR_today / avg_TR(vr_lookback) > vr_k
  - { indicator: wide_ranging_day_flag, operator: "==", value: 1 }
  # close_position_in_range = (Ct - Lt) / (Ht - Lt); высокое закрытие
  - { indicator: close_position_in_range, operator: ">=", value: close_position_thr }
  # ТРЕБУЕТСЯ фильтр «после продолжительного снижения» — численно не задан
  # книгой, см. вопрос к Нику; без него правило генерирует ложные сигналы.

exit: []

missing_indicators:
  - wide_ranging_day_flag    # VR = TR_today / avg_TR(vr_lookback) > vr_k; нужна реализация
  - close_position_in_range  # (Ct-Lt)/(Ht-Lt); нужна реализация
  - prior_downtrend_flag     # контекст предшествующего снижения; определение не задано книгой
