# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch06_reversal_day
status: candidate
source:
  book: schwager
  chapter: 6
  pages: [109, 113]

# Швагер считает СТАНДАРТНОЕ определение дня разворота (новый максимум, затем
# закрытие ниже закрытия предыдущего дня) бесполезным индикатором из-за
# лавины ложных сигналов [мнение автора, стр.111: «100 сигналов на каждые
# 10 максимумов»]. Здесь реализовано усиленное определение автора: новый
# максимум в аптренде + закрытие НИЖЕ МИНИМУМА предыдущего дня. Опция —
# ниже минимума ДВУХ предыдущих дней (ещё строже, меньше сигналов).
# Ещё вариант автора (стр.113): стандартное определение + одновременно шип
# (пересечение с ch06_spike) — «случаются довольно редко», но важнее.

params:
  reversal_confirm_days:
    value: REQUIRES_DECISION
    options: [1, 2]
    quote: "закрытие было ниже минимума двух предыдущих дней"
    page: 111
    note: "базово закрытие ниже минимума 1 пред. дня; жёстче — ниже минимума 2 пред. дней; оба варианта из книги, выбор влияет на число сигналов"

action: SELL
weight: REQUIRES_DECISION
description: "День верхнего разворота (усиленное опр. Швагера): новый максимум, затем закрытие ниже минимума N пред. дней"
conditions:
  # reversal_high_flag = 1 когда: зафиксирован новый максимум в аптренде И
  #   close < min(low за reversal_confirm_days предшествующих дней)
  - { indicator: reversal_high_flag, operator: "==", value: 1 }

exit: []

missing_indicators:
  - reversal_high_flag   # новый максимум + close < минимума N пред. дней; нужна реализация
  - reversal_low_flag    # зеркальное; нужна реализация
