# ============================================================
# QuantFlow — rules_wrd_moex.yaml
# Стратегия wrd_moex: система широкодиапазонного дня.
# Источник: Швагер «Технический анализ», гл. 18, стр. 651-661 —
# processed/strategies/systems_ch18_schwager.md.
#
# Событийная трендовая нога (взамен замороженной trend_moex):
# вход только по СОБЫТИЮ (ШД-день) с подтверждением закрытием
# за границей сигнального диапазона PTR.
#
# Отклонения от книги (фиксируются честно, как у osc_range):
#   - long-only: сигнал продажи = выход в кэш, а не разворот в шорт;
#   - поверх событийных входов работает общий контур движка
#     2×ATR-стоп + монотонный трейлинг (в книге стопов нет — чистый
#     SAR); книжная альтернатива — стоп по нижней границе PTR
#     (гл. 9, методы 2/4) — вариант для будущего A/B;
#   - VR-знаменатель: средний истинный диапазон предшествующих
#     atr_n дней (≈ATR) — развилка перевода стр. 652 зафиксирована
#     в конспекте гл. 18.
#
# Параметры — КНИЖНЫЕ (иллюстрация стр. 653: k=2.0, N=10, N1=4,
# N2=2), без подбора под результат (предостережения гл. 20;
# табл. 18.1 с полной сеткой потеряна при извлечении текста).
# Таймфрейм: D1 (у Швагера — дневные данные).
#
# ── Результаты (2026-07-13) ──────────────────────────────────
# Бэктест D1, 12 тикеров, 2023-07..2026-07 (run_wrd_backtest.py):
#   полный период n=191, PF 0.86, −614k; IS PF 1.18, +322k;
#   OOS (2025-01+) PF 0.65, −936k.
# A/B чистый книжный SAR vs ATR-контур (run_ab_wrd_sar.py,
# use_stops движка — единственная переменная): SAR проиграл по
# всем разрезам — OOS PF 0.38 vs 0.65, IS 0.99 vs 1.18, payoff
# 1.29 vs 1.98. ATR-трейлинг сильнее книжного разворотного
# выхода (проблема 4 гл. 17: медленные системы отдают прибыль).
#
# СТАТУС: ЗАМОРОЖЕНА, в форвард не пускать. Причина: событийный
# вход работает (дефект №2 гл. 17 — «пила» — конструкцией снят),
# но long-only от медведя (дефект №5) не решён — OOS 2025-26
# повторяет trend_moex. Фильтр направления сознательно НЕ вводим:
# на единственном медвежьем периоде это подгонка, а не фикс.
# ============================================================

settings:
  min_buy_score: 1.5
  min_sell_score: 1.5
  confirmation_rules: 1     # событие + закрытие за уровнем = один сигнал, кворума нет

# ── Детектор ШД-дня и сигнального диапазона PTR ──────────────
# ШД-день: истинный диапазон дня > k × средний истинный диапазон
# предшествующих atr_n дней. PTR: max/min истинных экстремумов на
# [ШД−n1; ШД+n2]; определяется спустя n2 дней после ШД-дня, сигналы
# дня определения — по старому PTR (порядок стр. 653).
wrd:
  k: 2.0
  atr_n: 10
  n1: 4
  n2: 2

rules:
  # Покупка: закрытие выше верхней границы действующего PTR (стр. 652)
  - name: wrd_ptr_break_up
    action: BUY
    weight: 1.5
    description: "Закрытие выше верхней границы PTR действующего ШД-дня"
    conditions:
      - { indicator: close, operator: ">", value: ptr_high }

  # Продажа (long-only: выход в кэш): закрытие ниже нижней границы PTR
  - name: wrd_ptr_break_down
    action: SELL
    weight: 1.5
    description: "Закрытие ниже нижней границы PTR — разворотный сигнал"
    conditions:
      - { indicator: close, operator: "<", value: ptr_low }

# Трендследящая система: ADX-блокировок и структурного фильтра нет —
# событие + подтверждение закрытием сами по себе фильтр (гл. 17,
# решение 2b: ненулевые n1/n2 расширяют PTR и режут «пилу»).
filters: []

# Выход = SELL-сигнал (книжный SAR) + общий 2×ATR-стоп/трейлинг движка.
exit_rules: []

ticker_specific: []
macro_filters: []
