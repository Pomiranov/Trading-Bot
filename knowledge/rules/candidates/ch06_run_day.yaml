# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch06_run_day
status: candidate
source:
  book: schwager
  chapter: 6
  pages: [114, 116]

# День ускорения = день с ярко выраженным трендом, более сильная версия
# разгонного дня. Группы дней верхнего ускорения = свидетельство «бычьей»
# фазы (стр.116), нижнего ускорения = «медвежьей». Используется в гл.18
# для конструирования торговых систем (стр.116) → релевантно trend_moex.
# ВНИМАНИЕ (lookahead): день ускорения невозможно распознать, пока не
# пройдёт N дней после его появления (стр.115) — использует истинные
# экстремумы ПОСЛЕДУЮЩИХ N дней. В реалтайме это запаздывающий на N баров
# признак режима, НЕ мгновенный вход. Учесть в бэктесте.

params:
  run_n:
    value: REQUIRES_DECISION
    options: [5, 10]            # 5 — пример из книги, 10 — предложение агента
    quote: "выше наивысшего истинного максимума за N предшествующих дней (например, N = 5)"
    page: 114
    note: "то же N применяется к N последующим дням; 5 — пример"

action: BUY
weight: REQUIRES_DECISION
description: "День верхнего ускорения: истинный макс > макс N пред. дней И истинный мин < мин N след. дней; группами = бычья фаза / фильтр тренда"
conditions:
  # run_day_up_flag = 1 когда:
  #   true_high(t) > max(true_high) за run_n предшествующих дней  И
  #   true_low(t)  < min(true_low)  за run_n последующих дней
  - { indicator: run_day_up_flag, operator: "==", value: 1 }

exit: []

missing_indicators:
  - run_day_up_flag    # определение выше (стр.114); нужна реализация
  - run_day_down_flag  # зеркальное (стр.114-115); нужна реализация
