# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch23_drawdown_derisk
status: candidate
source:
  book: schwager
  chapter: 23
  pages: [781, 782]   # правила 24, 25, 26

params:
  drawdown_trigger_pct:
    value: REQUIRES_DECISION
    options: [5, 10]
    why: "«когда торговля идёт плохо» — качественный критерий, порог просадки
      счёта в книге не задан; 5 / 10 — предложение агента, в книге числа нет"
  size_reduction_factor:
    value: REQUIRES_DECISION
    options: [0.5, 0.75]
    why: "«уменьшайте размер позиции» — во сколько раз не сказано;
      0.5 / 0.75 — предложение агента, в книге числа нет"

action: RISK_SCALE
weight: REQUIRES_DECISION
description: "Правила 24-26: при просадке счёта (а) уменьшить размер позиции,
  (б) использовать близкие защитные остановки, (в) не начинать новые сделки
  торопливо; ликвидировать УБЫТОЧНЫЕ позиции, а не выигрышные (правило 25);
  не начинать сделки, казавшиеся слишком рискованными в начале программы
  (правило 26а). Не усреднять проигрышную позицию."
conditions:
  - { indicator: current_drawdown_pct, operator: ">=", value: drawdown_trigger_pct }

actions_on_trigger:
  - reduce_new_position_size: size_reduction_factor
  - tighten_stops: true
  - liquidate_losers_first: true      # правило 25
  - no_averaging_losers: true         # правило 25

missing_indicators:
  - current_drawdown_pct   # нужна реализация: текущая просадка капитала от пика, % (equity curve)
