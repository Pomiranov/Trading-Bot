# ============================================================
# QuantFlow — очередь разбора глав для chapter-reader.
#
# Правится РУКАМИ. tools/read_chapters.py меняет только поля
# status / attempts / last_error / card, остальное не трогает.
#
# pages — ПЕЧАТНЫЕ номера страниц книги (те же, что в
# processed/market_theory/schwager_index.md: «стр. 655»).
# Физическая страница PDF = печатная - page_offset.
# Границы глав и offset даёт tools/build_chapter_queue.py:
#   python tools\build_chapter_queue.py --detect-offset 20   # замерить offset
#   python tools\build_chapter_queue.py --page-offset -12    # черновик очереди
# Затем сверить chapters.draft.yaml глазами и перенести pages сюда.
#
# pages: [] означает «границы не заданы» — раннер такую главу не берёт,
# а не извлекает случайный кусок книги.
#
# Комментарии YAML при перезаписи не сохраняются, поэтому человеческие
# пометки живут в поле note (эта шапка — константа в раннере).
#
# category — куда пойдёт конспект: technical | risk | strategies |
# market_theory. Выбирает человек, не агент.
#
# Порядок = приоритет из «Рекомендованный порядок обработки (проход 2)»
# в schwager_index.md, пункты 6-10. Главы 9, 11, 15, 17, 18 уже разобраны
# вручную и в очередь не входят.
# ============================================================

