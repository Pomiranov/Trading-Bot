# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch10_rule_of_seven
status: candidate
source:
  book: schwager
  chapter: 10
  pages: [180, 182]

params:
  multiplier_5:
    value: 1.4
    quote: "множители равны: 7 : 5 = 1,4; 7 : 4 = 1,75; 7 : 3 = 2,33 и 7 : 2 = 3,5"
    page: 180
    note: "7/5; для медвежьего рынка (первые три множителя)"
  multiplier_4:
    value: 1.75
    quote: "7 : 4 = 1,75"
    page: 180
  multiplier_3:
    value: 2.33
    quote: "7 : 3 = 2,33"
    page: 180
  multiplier_2:
    value: 3.5
    quote: "7 : 2 = 3,5"
    page: 180
    note: "7/2; для бычьего рынка (последние три множителя)"
  swing_lookback:
    value: REQUIRES_DECISION
    options: [20, 60]
    why: "цель = минимум + множитель × длина ПЕРВОГО скачка цен; но 'что
      является первым скачком цен в тенденции, может меняться от трейдера к
      трейдеру' (стр.180) — окно/правило определения первой волны не задано;
      20 / 60 бар — предложение агента, в книге числа нет"
  target_index:
    value: REQUIRES_DECISION
    options: [2, 3, 4]
    why: "каждый из трёх множителей даёт свою цель; какую из трёх целей брать
      как единственный take-profit — книга не предписывает (цели 2/3/4 для
      бычьего рынка, стр.181); выбор конкретной цели/логики — за ревью"

# Бычий рынок: используются множители 1,75; 2,33; 3,5, произведение на длину
# первой волны прибавляется к минимуму. Медвежий: 1,4; 1,75; 2,33 вычитаются
# из максимума (стр.180).
action: EXIT_LONG          # фиксация прибыли по достижении расчётной цели (SHORT зеркально)
weight: REQUIRES_DECISION
description: "Правило семи (Склэрью): цель = экстремум ± множитель(7/n) × длина
  первой волны тренда. Бычий рынок — множители 1,75/2,33/3,5 к минимуму;
  медвежий — 1,4/1,75/2,33 от максимума."
conditions:
  - { indicator: close, operator: ">=", value: rule_of_seven_target, note: "цель = min + multiplier × first_wave_length, стр.180-181" }

missing_indicators:
  - first_wave_length        # длина первой импульсной волны тренда — нужна реализация (определение субъективно, см. вопрос 2)
  - rule_of_seven_target     # extreme ± multiplier × first_wave_length — нужна реализация

# Оговорки автора: примеры (рис.10.6-10.7) отбирались задним числом; 'в
# большинстве случаев соответствие... не будет столь близким' (стр.181-182);
# методу присуща субъективность определения первой волны (стр.180).
# [мнение автора] 'вполне приемлемый подход', 'экспериментирование может
# повысить эффективность' (стр.182).
