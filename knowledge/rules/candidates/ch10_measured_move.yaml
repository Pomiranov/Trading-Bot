# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch10_measured_move
status: candidate
source:
  book: schwager
  chapter: 10
  pages: [174, 177]

params:
  swing_lookback:
    value: REQUIRES_DECISION
    options: [20, 60]
    why: "метод строится на 'предыдущем колебании цен в том же направлении',
      но окно поиска этого колебания (какой свинг считать базовым) книга не
      задаёт — сам автор пишет, что база субъективна; 20 / 60 бар —
      предложение агента, в книге числа нет"
  target_tolerance_pct:
    value: REQUIRES_DECISION
    options: [0.5, 1.0]
    why: "'указал на уровень ... совсем близко к фактическому минимуму' —
      совпадение приблизительное, целевая ЗОНА, ширина не названа (стр.175);
      0.5 / 1.0 % — предложение агента, в книге числа нет"

# По книге: величина ожидаемого движения ≈ величине предыдущего колебания
# в том же направлении. Для лонга: target = correction_low + prior_swing_up.
action: EXIT_LONG          # фиксация прибыли по достижении цели (SHORT зеркально)
weight: REQUIRES_DECISION
description: "Измеренное движение: цель хода = экстремум коррекции ± величина
  предыдущего колебания цен в том же направлении. Несколько совпадающих
  целей повышают надёжность зоны (стр.176). SHORT зеркально."
conditions:
  # цена достигла проекции измеренного движения → фиксировать длинную позицию
  - { indicator: close, operator: ">=", value: measured_move_target, note: "цель = correction_low + prior_swing_up, стр.174" }

exit:
  # это и есть правило выхода (take-profit); отдельного exit-блока нет

missing_indicators:
  - prior_swing_move       # величина предыдущего колебания в том же направлении — нужна реализация
  - measured_move_target   # correction_extreme ± prior_swing_move — нужна реализация
  - mm_cluster_count       # число независимых MM-целей, попавших в одну зону (для повышения надёжности) — нужна реализация

# Оговорка автора (стр.173): графические модели значительно менее надёжны
# в ПРЕДСКАЗАНИИ целей, чем как торговые сигналы. Метод отбирался на примерах
# задним числом.
