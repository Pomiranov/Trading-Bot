# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch05_envelope_band
status: candidate
source:
  book: schwager
  chapter: 5
  pages: [101, 102]

params:
  ma_period:
    value: REQUIRES_DECISION
    options: [20]
    quote: "используется 20-дневная скользящяя средняя и 2,5%-ное отклонение"
    page: 101
    why: "20 дней приведено в примере к рис.5.25 (казначейские векселя,
      март 1995) — иллюстрация, не универсальный параметр; оставлено на выбор"
  envelope_pct:
    value: REQUIRES_DECISION
    options: [1.2, 2.5]
    quote: "20-дневная скользящяя средняя и 2,5%-ное отклонение … 1,2%-ную огибающую"
    page: 101
    why: "книга приводит ДВА значения отклонения (2,5% и 1,2%) для одного рынка
      на разных периодах — оба примеры, единого значения нет; подбирается так,
      чтобы полоса охватывала большую часть ценовой активности (стр.101)"

action: SELL
weight: REQUIRES_DECISION
description: "Огибающая полоса MA±% как зона перекупленности/перепроданности:
  касание верхней границы = потенциальное сопротивление (фейд/фиксация long).
  BUY-вариант зеркален (касание нижней границы = потенциальная поддержка).
  [мнение автора] инструмент НЕ надёжен: цены могут долго держаться у границы."
conditions:
  - { indicator: close, operator: ">=", value: ma_envelope_upper, note: "цена у верхней границы огибающей, стр.101" }

exit:
  # книга выходов/целей для огибающей полосы не задаёт (только предупреждает
  # о ненадёжности разворота у границы) — стоп/цель в REQUIRES_DECISION-режиме
  - { indicator: close, operator: "<", value: ma_envelope_middle, note: "фиксация при возврате к средней (MA), стр.101 — предложение агента, книга выхода не даёт" }

missing_indicators:
  - ma_envelope_upper      # MA*(1 + envelope_pct/100) — нужна реализация (в движке нет)
  - ma_envelope_lower      # MA*(1 - envelope_pct/100) — нужна реализация
  - ma_envelope_middle     # сама MA — есть в движке (SMA/EMA)
