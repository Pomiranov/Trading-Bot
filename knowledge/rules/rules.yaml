# Торговые правила для алгоритмического бота MOEX
# Каждое правило: name, conditions (список), action (BUY/SELL/HOLD), weight, description

rules:
  # ─── Правила на покупку ───────────────────────────────────────────────

  - name: "RSI_Oversold_Bounce"
    description: "Цена перепродана — RSI выходит из зоны перепроданности"
    action: BUY
    weight: 1.0
    conditions:
      - indicator: rsi
        operator: "<"
        value: 35
      - indicator: macd_hist
        operator: ">"
        value: 0

  - name: "EMA_Bullish_Cross"
    description: "Быстрая EMA пересекает медленную EMA снизу вверх"
    action: BUY
    weight: 1.5
    conditions:
      - indicator: price_above_ema_fast
        operator: "=="
        value: true
      - indicator: price_above_ema_slow
        operator: "=="
        value: true
      - indicator: adx
        operator: ">"
        value: 20

  - name: "MACD_Bullish_Crossover"
    description: "MACD пересекает сигнальную линию снизу вверх"
    action: BUY
    weight: 1.2
    conditions:
      - indicator: macd_bullish_cross
        operator: "=="
        value: true
      - indicator: rsi
        operator: ">"
        value: 40
      - indicator: rsi
        operator: "<"
        value: 65

  - name: "BB_Lower_Bounce"
    description: "Цена отбивается от нижней полосы Боллинджера при слабом тренде"
    action: BUY
    weight: 0.8
    conditions:
      - indicator: bb_pct
        operator: "<"
        value: 0.1
      - indicator: rsi
        operator: "<"
        value: 40
      - indicator: adx
        operator: "<"
        value: 30

  - name: "Strong_Trend_Continuation_Buy"
    description: "Продолжение сильного восходящего тренда — ADX высокий, +DI > -DI"
    action: BUY
    weight: 1.8
    conditions:
      - indicator: adx
        operator: ">"
        value: 30
      - indicator: adx_pos
        operator: ">"
        value: adx_neg
      - indicator: price_above_ema_fast
        operator: "=="
        value: true

  - name: "VWAP_Support_Buy"
    description: "Цена выше VWAP — подтверждение покупательского давления"
    action: BUY
    weight: 0.7
    conditions:
      - indicator: close
        operator: ">"
        value: vwap

  # ─── Правила на продажу ──────────────────────────────────────────────

  - name: "RSI_Overbought_Exit"
    description: "Цена перекуплена — RSI заходит в зону перекупленности"
    action: SELL
    weight: 1.0
    conditions:
      - indicator: rsi
        operator: ">"
        value: 70
      - indicator: macd_hist
        operator: "<"
        value: 0

  - name: "EMA_Bearish_Cross"
    description: "Быстрая EMA пересекает медленную EMA сверху вниз"
    action: SELL
    weight: 1.5
    conditions:
      - indicator: price_above_ema_fast
        operator: "=="
        value: false
      - indicator: price_above_ema_slow
        operator: "=="
        value: false
      - indicator: adx
        operator: ">"
        value: 20

  - name: "MACD_Bearish_Crossover"
    description: "MACD пересекает сигнальную линию сверху вниз"
    action: SELL
    weight: 1.2
    conditions:
      - indicator: macd_bearish_cross
        operator: "=="
        value: true
      - indicator: rsi
        operator: ">"
        value: 50

  - name: "BB_Upper_Rejection"
    description: "Цена отвергается верхней полосой Боллинджера"
    action: SELL
    weight: 0.8
    conditions:
      - indicator: bb_pct
        operator: ">"
        value: 0.9
      - indicator: rsi
        operator: ">"
        value: 60

  - name: "Strong_Trend_Continuation_Sell"
    description: "Продолжение сильного нисходящего тренда — ADX высокий, -DI > +DI"
    action: SELL
    weight: 1.8
    conditions:
      - indicator: adx
        operator: ">"
        value: 30
      - indicator: adx_neg
        operator: ">"
        value: adx_pos
      - indicator: price_above_ema_fast
        operator: "=="
        value: false

  - name: "VWAP_Resistance_Sell"
    description: "Цена ниже VWAP — давление продавцов"
    action: SELL
    weight: 0.7
    conditions:
      - indicator: close
        operator: "<"
        value: vwap

# ─── Параметры движка правил ──────────────────────────────────────────
settings:
  min_buy_score: 3.0       # Минимальный суммарный вес для сигнала BUY
  min_sell_score: 3.0      # Минимальный суммарный вес для сигнала SELL
  confirmation_rules: 2    # Минимальное количество сработавших правил

# ─── Фильтры блокировки торговли ──────────────────────────────────────
# Когда хотя бы один фильтр активен — новые сделки не открываются.
# Движок проверяет эти условия ПЕРЕД оценкой rules.
# action: BLOCK — специальное значение, не BUY/SELL.

filters:
  - name: "Low_Liquidity_Filter"
    description: "Объём слишком низкий — спреды широкие, исполнение ненадёжное"
    action: BLOCK
    weight: 999
    conditions:
      - indicator: adx
        operator: "<"
        value: 15
      - indicator: rsi
        operator: ">"
        value: 45
      - indicator: rsi
        operator: "<"
        value: 55

  - name: "Extreme_Volatility_Filter"
    description: "ATR аномально высокий — рынок непредсказуем, стопы будут срабатывать хаотично"
    action: BLOCK
    weight: 999
    conditions:
      - indicator: bb_pct
        operator: ">"
        value: 1.2

  - name: "No_Trend_Flat_Market"
    description: "Флэт: ADX низкий, цена болтается между EMA — трендовые стратегии не работают"
    action: BLOCK
    weight: 999
    conditions:
      - indicator: adx
        operator: "<"
        value: 22
      - indicator: price_above_ema_fast
        operator: "=="
        value: true
      - indicator: price_above_ema_slow
        operator: "=="
        value: false

# ─── Правила выхода из позиции ────────────────────────────────────────
# Применяются к открытым позициям. action: EXIT означает закрыть позицию.
# Движок проверяет exit_rules для каждой открытой позиции на каждой свече.

exit_rules:
  - name: "Trailing_Stop_ATR"
    description: "Скользящий стоп: цена упала более чем на 2×ATR от локального максимума"
    action: EXIT
    weight: 2.0
    conditions:
      - indicator: close
        operator: "<"
        value: bb_lower
      - indicator: rsi
        operator: "<"
        value: 35

  - name: "Take_Profit_BB_Upper"
    description: "Тейк-профит у верхней полосы Боллинджера при перекупленности"
    action: EXIT
    weight: 1.5
    conditions:
      - indicator: bb_pct
        operator: ">"
        value: 0.95
      - indicator: rsi
        operator: ">"
        value: 68

  - name: "Trend_Reversal_Exit"
    description: "Тренд сменился: EMA пересечение подтверждено MACD"
    action: EXIT
    weight: 1.8
    conditions:
      - indicator: macd_bearish_cross
        operator: "=="
        value: true
      - indicator: price_above_ema_slow
        operator: "=="
        value: false
      - indicator: adx
        operator: ">"
        value: 22

# ─── Правила для конкретных тикеров ───────────────────────────────────
# Переопределяют или дополняют общие rules для конкретного инструмента.
# Движок применяет ticker_specific только если ticker совпадает.
# Поле ticker: FIGI или тикер (SBER, GAZP, LKOH, NVTK, YNDX).

ticker_specific:
  - name: "SBER_Oversold_Strong_Buy"
    description: "СБЕР: глубокая перепроданность + объём — агрессивный откуп институционалов"
    ticker: SBER
    action: BUY
    weight: 2.0
    conditions:
      - indicator: rsi
        operator: "<"
        value: 28
      - indicator: bb_pct
        operator: "<"
        value: 0.05
      - indicator: macd_hist
        operator: ">"
        value: 0

  - name: "YNDX_High_Volatility_Wait"
    description: "Яндекс: ADX экстремально высокий — не входить против тренда"
    ticker: YNDX
    action: BLOCK
    weight: 999
    conditions:
      - indicator: adx
        operator: ">"
        value: 45
      - indicator: price_above_ema_fast
        operator: "=="
        value: false

  - name: "SBER_Downtrend_Block"
    description: "СБЕР: цена ниже медленной EMA и медведи доминируют — не покупать в падающий рынок"
    ticker: SBER
    action: BLOCK
    weight: 999
    conditions:
      - indicator: price_above_ema_slow
        operator: "=="
        value: false
      - indicator: adx_neg
        operator: ">"
        value: adx_pos

  - name: "GAZP_Uptrend_Required"
    description: "ГАЗПРОМ: входить только при выраженном восходящем тренде — ADX > 25 и +DI > -DI"
    ticker: GAZP
    action: BLOCK
    weight: 999
    conditions:
      - indicator: adx
        operator: "<"
        value: 25


# ─── Макро-фильтры ────────────────────────────────────────────────────
# Условия на основе рыночного контекста — применяются ко всем тикерам.
# Используют те же индикаторы, но интерпретируются как рыночный режим.
# Когда активен macro_filter — снижать веса всех сигналов на 50%.

macro_filters:
  - name: "Market_Wide_Selloff"
    description: "Широкий рынок падает: все индикаторы в медвежьей зоне — только шорт или стоп"
    action: BLOCK
    weight: 999
    conditions:
      - indicator: price_above_ema_slow
        operator: "=="
        value: false
      - indicator: adx_neg
        operator: ">"
        value: adx_pos
      - indicator: rsi
        operator: "<"
        value: 40
      - indicator: macd_hist
        operator: "<"
        value: 0

  - name: "Pre_Dividend_Cutoff_Caution"
    description: "Перепроданность + BB сжатие — возможна отсечка, воздержаться от лонга"
    action: BLOCK
    weight: 999
    conditions:
      - indicator: bb_pct
        operator: "<"
        value: 0.15
      - indicator: adx
        operator: "<"
        value: 20
      - indicator: rsi
        operator: "<"
        value: 45

  - name: "Risk_On_Mode"
    description: "Рынок в режиме risk-on: все условия благоприятны, можно торговать агрессивнее"
    action: ALLOW
    weight: 1.0
    conditions:
      - indicator: price_above_ema_slow
        operator: "=="
        value: true
      - indicator: adx_pos
        operator: ">"
        value: adx_neg
      - indicator: rsi
        operator: ">"
        value: 50
      - indicator: close
        operator: ">"
        value: vwap
