# Черновик. Не подключать к движку до ревью и бэктеста.
id: ch05_prev_high_low_breakout
status: candidate
source:
  book: schwager
  chapter: 5
  pages: [88, 92]

params:
  swing_lookback:
    value: REQUIRES_DECISION
    options: [60, 120]
    why: "'предыдущий важный максимум/минимум' — важность (значимость свинга) в
      гл.5 численно не определена; окно поиска пивота не задано;
      60 / 120 — предложение агента, в книге числа нет"
  level_tolerance_pct:
    value: REQUIRES_DECISION
    options: [0.5, 1.0]
    quote: "нужно рассматривать как приблизительные области, а не точные уровни"
    page: 88
    why: "книга прямо требует трактовать уровень как ЗОНУ, но ширину зоны не
      называет; 0.5 / 1.0 % — предложение агента, в книге числа нет"
  confirm_closes:
    value: REQUIRES_DECISION
    options: [2, 3]
    quote: "принимая за условие подтверждения три закрытия над максимумом"
    page: 89
    why: "3 закрытия названы как условие подтверждения В ПРИМЕРАХ к рисункам
      5.8–5.11, а не как жёстко заданный параметр; в гл.11 для ложного пробоя
      линии тренда фигурируют 2 закрытия — окно надо выбрать/оптимизировать"
  min_breakout_pct:
    value: REQUIRES_DECISION
    options: [1, 3]
    why: "'минимальное процентное изменение цены после пробоя' названо как
      альтернативное условие подтверждения, число не задано (стр.89);
      1 / 3 % — предложение агента, в книге числа нет"

action: BUY
weight: REQUIRES_DECISION
description: "Пробой предыдущего важного максимума как сигнал к покупке,
  подтверждённый минимальным числом закрытий выше уровня И/ИЛИ мин.% хода.
  SELL-вариант зеркален (пробой вниз предыдущего минимума)."
conditions:
  # цена пробила зону предыдущего важного максимума
  - { indicator: close, operator: ">", value: prev_swing_high, note: "уровень трактуется как зона ± level_tolerance_pct, стр.88" }
  # подтверждение по числу закрытий за уровнем
  - { indicator: closes_beyond_level, operator: ">=", value: confirm_closes, note: "подтверждение по закрытиям, стр.89" }
  # альтернативное подтверждение по величине хода (в движке — ИЛИ с предыдущим; выбор в вопросе 2)
  - { indicator: breakout_dist_pct, operator: ">=", value: min_breakout_pct, note: "альтернативное подтверждение по величине, стр.89" }

exit:
  # После подтверждённого пробоя роль уровня меняется: бывшее сопротивление
  # становится поддержкой (стр.92). Стоп/цель в R книга не задаёт.
  - { indicator: close, operator: "<", value: prev_swing_high, note: "инвалидация: возврат под пробитый уровень (бывшее сопротивление = новая поддержка), стр.92" }

missing_indicators:
  - prev_swing_high        # уровень предыдущего важного максимума — нужна реализация (в движке нет)
  - prev_swing_low         # уровень предыдущего важного минимума — нужна реализация
  - closes_beyond_level    # счётчик подряд идущих закрытий за уровнем — нужна реализация
  - breakout_dist_pct      # (close - prev_swing_high)/prev_swing_high — нужна реализация; есть в черновике гл.4
